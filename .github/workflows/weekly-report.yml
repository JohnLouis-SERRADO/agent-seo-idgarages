name: Weekly SEO Report

# ⏸️ AGENT EN PAUSE — l'envoi automatique du vendredi a été retiré.
# Pour réactiver : remets le bloc `schedule` ci-dessous.
#   schedule:
#     - cron: "0 10 * * 5"   # vendredi 10h00 UTC (= 11h Paris en hiver)
on:
  workflow_dispatch:  # exécution manuelle uniquement (bouton "Run workflow")

permissions:
  contents: read  # uniquement lecture — la DB n'est pas modifiée par le report

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite DB
        run: |
          mkdir -p data
          if git ls-remote --heads origin data | grep -q data; then
            git fetch origin data --depth=1
            git show origin/data:seo_monitor.db > data/seo_monitor.db
            ls -lh data/seo_monitor.db
          else
            echo "::error::Pas de branche 'data' — le daily-crawl n'a jamais tourné avec succès. Lance-le manuellement avant le rapport."
            exit 1
          fi

      - name: Generate and send weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_SITE:       ${{ vars.TARGET_SITE }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
        run: python main.py report
