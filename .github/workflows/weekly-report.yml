name: Weekly SEO Report

# Tourne le vendredi à 10h00 UTC.
#   - En hiver  (CET, UTC+1) : 10h UTC = 11h Paris ✅
#   - En été    (CEST, UTC+2): 10h UTC = 12h Paris (décalage d'1h accepté)
# Si tu préfères "11h Paris toute l'année", passe à `0 9 * * 5` en été
# (10h Paris en hiver dans ce cas).
on:
  schedule:
    - cron: "0 10 * * 5"  # vendredi 10h UTC
  workflow_dispatch:

permissions:
  contents: read  # uniquement lecture — la DB n'est pas modifiée par le report

# Force Node.js 24 pour les actions JavaScript (silencie le warning de
# dépréciation de Node.js 20, en place jusqu'à septembre 2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore SQLite DB
        run: |
          mkdir -p data
          if git ls-remote --heads origin data | grep -q data; then
            git fetch origin data --depth=1
            git show origin/data:seo_monitor.db > data/seo_monitor.db
            ls -lh data/seo_monitor.db
          else
            echo "::error::Pas de branche 'data' — le daily-crawl n'a jamais tourné avec succès. Lance-le manuellement avant le rapport."
            exit 1
          fi

      - name: Generate and send weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_SITE:       ${{ vars.TARGET_SITE }}
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:     ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM:        ${{ secrets.EMAIL_FROM }}
          EMAIL_TO:          ${{ secrets.EMAIL_TO }}
        run: python main.py report
