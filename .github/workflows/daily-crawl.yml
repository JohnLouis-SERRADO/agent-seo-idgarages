name: Daily SEO Crawl

# ⏸️ AGENT EN PAUSE — le déclenchement automatique quotidien a été retiré.
# Pour réactiver : remets le bloc `schedule` ci-dessous.
#   schedule:
#     - cron: "0 3 * * *"   # tous les jours à 03h00 UTC
on:
  workflow_dispatch:  # exécution manuelle uniquement (bouton "Run workflow")

# Permission d'écriture pour committer la DB mise à jour sur la branche `data`.
permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    # Filet de sécurité uniquement : l'agent s'arrête tout seul au bout de
    # MAX_CRAWL_MINUTES (20 par défaut) et sauvegarde son travail. Ce timeout
    # ne doit jamais se déclencher — s'il se déclenche, baisse MAX_CRAWL_MINUTES.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Playwright a besoin du binaire Chromium + des libs système
      # (~180 Mo). `install --with-deps` télécharge tout en une commande.
      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      # ─── Restauration de la DB depuis la branche `data` ───────────────────
      # La branche `data` est une branche orpheline qui contient uniquement
      # le fichier seo_monitor.db. Au tout premier run elle n'existe pas
      # encore — on démarre alors avec une DB vide, et `data` sera créée à
      # l'étape de sauvegarde.
      - name: Restore SQLite DB
        run: |
          mkdir -p data
          if git ls-remote --heads origin data | grep -q data; then
            echo "Pulling DB from data branch…"
            git fetch origin data --depth=1
            git show origin/data:seo_monitor.db > data/seo_monitor.db
            ls -lh data/seo_monitor.db
          else
            echo "No data branch yet — starting with empty DB"
          fi

      # ─── Crawl ────────────────────────────────────────────────────────────
      # Le crawl ne sert qu'à remplir la base : ni clé API ni SMTP ici.
      # Sort en code != 0 si aucune page n'a pu être visitée.
      - name: Run daily crawl
        env:
          TARGET_SITE:         ${{ vars.TARGET_SITE }}
          MAX_PAGES_PER_DAY:   ${{ vars.MAX_PAGES_PER_DAY }}
          MAX_CRAWL_MINUTES:   ${{ vars.MAX_CRAWL_MINUTES }}
          MAX_REDIRECT_HOPS:   ${{ vars.MAX_REDIRECT_HOPS }}
          CRAWL_DELAY_SECONDS: ${{ vars.CRAWL_DELAY_SECONDS }}
          RESPECT_ROBOTS_TXT:  ${{ vars.RESPECT_ROBOTS_TXT }}
        run: python main.py crawl

      # ─── Sauvegarde de la DB sur la branche `data` ────────────────────────
      # Stratégie : on garde un seul commit dans `data` (force-push). Ça évite
      # que la branche grossisse de 10 Mo par jour pour rien. Le passé n'est
      # pas crucial — ce qui compte c'est la photo la plus récente.
      # `if: always()` : même un cycle interrompu (timeout, crash à mi-parcours)
      # a découvert des URLs et journalisé des erreurs. Les jeter ferait
      # repartir de zéro le lendemain — et au tout premier run, la branche
      # `data` ne serait jamais créée.
      - name: Save SQLite DB to data branch
        if: always()
        run: |
          if [ ! -f data/seo_monitor.db ]; then
            echo "Aucune base à sauvegarder (le job a échoué avant sa création) — étape ignorée."
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # On extrait la DB avant de changer de branche (sinon elle disparaît)
          cp data/seo_monitor.db /tmp/seo_monitor.db

          # Recrée une branche orpheline fraîche à chaque run
          git checkout --orphan tmp-data
          git rm -rf . 2>/dev/null || true
          cp /tmp/seo_monitor.db seo_monitor.db
          git add seo_monitor.db
          git commit -m "Update DB ($(date -u +%FT%TZ))"
          git push --force origin tmp-data:data
